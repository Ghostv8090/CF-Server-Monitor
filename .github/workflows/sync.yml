name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch --no-tags upstream main

          if git diff --quiet HEAD upstream/main; then
            echo "Already up to date."
            exit 0
          fi

          # Keep this fork's production-only customizations (Cloudflare
          # bindings, custom domain, and the single-Cron scheduler) when an
          # upstream change touches the same hunk. Non-conflicting upstream
          # changes are merged normally.
          git merge --no-edit -X ours upstream/main
          git push origin HEAD:main

      - name: Sync check
        if: failure()
        run: |
          echo "Upstream sync failed. Check the merge output above; the fork was not pushed."
          exit 1
